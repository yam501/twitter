server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $users http://users:9000;
    set $messages http://messages:9001;
    set $subscriptions http://subscriptions:9002;

    location /api/v1/users { proxy_pass $users$request_uri; }
    location /api/v1/auth { proxy_pass $users$request_uri; }
    location /api/v1/messages { proxy_pass $messages$request_uri; }
    location /api/v1/subscribers { proxy_pass $subscriptions$request_uri; }
    location / { return 404; }
}
