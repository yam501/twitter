server:
  port: 9001
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5441/messages_db}
    username: ${DB_USER:twitter}
    password: ${DB_PASSWORD:twitter}
  sql:
    init:
      mode: always
      separator: ^^
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-32-bytes-minimum-length}
services:
  users-url: ${USERS_SERVICE_URL:http://localhost:9000}
  subscribers-url: ${SUBSCRIBERS_SERVICE_URL:http://localhost:9002}
